version: "3.8"
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shopdb
      MYSQL_USER: shop
      MYSQL_PASSWORD: shop_pw
      MYSQL_ROOT_PASSWORD: root_pw
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
